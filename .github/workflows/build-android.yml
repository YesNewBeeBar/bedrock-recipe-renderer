name: Build Android APK (Kivy)

# 在 GitHub 的 Linux 机器上编译 APK，本地不需要 WSL / Android SDK。
# 手动触发，或推送 android-kivy 目录的改动时触发。
on:
  workflow_dispatch:
  push:
    branches: [android-port, android-kivy]
    paths:
      - 'android-kivy/**'
      - '.github/workflows/build-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # libffi 的 autoreconf 靠它找到 libtool.m4，否则报 LT_SYS_SYMBOL_USCORE
      ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
      # runner 有时会解析到没有出口的 IPv6（Errno 101 Network is unreachable），
      # 加固 pip 的重试/超时，并显式指定索引
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_RETRIES: '5'
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-kivy/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # 用社区维护的 buildozer action：它会装好与目标一致的 Python + SDK/NDK + pip 配置，
      # 避免手搓环境时出现的 "cp314 wheel is not a supported wheel on this platform"
      - name: Build with buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: android-kivy
          buildozer_version: stable
          command: android debug

      - name: Show APK path
        run: echo "apk=${{ steps.buildozer.outputs.filename }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-recipe-renderer-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          if-no-files-found: error   # 没出 APK 就是失败，别藏着

      - name: Upload build log (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android-kivy/build.log

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-kivy/bin/*.apk
