name: Build Android APK (Kivy)

# 在 GitHub 的 Linux 机器上编译 APK，本地不需要 WSL / Android SDK。
# 手动触发，或推送 android-kivy 目录的改动时触发。
on:
  workflow_dispatch:
  push:
    branches: [android-port, android-kivy]
    paths:
      - 'android-kivy/**'
      - '.github/workflows/build-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-kivy/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Build debug APK
        working-directory: android-kivy
        shell: bash
        run: |
          set -o pipefail                     # 否则 tee 会顶替 buildozer 的退出码
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-recipe-renderer-apk
          path: android-kivy/bin/*.apk
          if-no-files-found: error   # 没出 APK 就是失败，别藏着

      - name: Upload build log (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android-kivy/build.log

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-kivy/bin/*.apk
